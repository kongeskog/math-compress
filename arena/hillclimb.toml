# Hillclimb configuration for the VP != VNP formalization.
# This file is frozen: a pull request that changes it is rejected.

[project]
slug = "vp-vnp"
title = "VP ≠ VNP"
description = "Shorten the Lean 4 formalization of VP ≠ VNP while it proves exactly the same theorems."
repo = "kongeskog/formal-math"
harness_repo = "kongeskog/math-compress"
upstream = "https://github.com/anthropics/formal-math/tree/main/vp-vnp"
branch = "main"
dir = "vp-vnp"
counted = ["**/*.lean"]
frozen = [
  "vp-vnp/Statement.lean",
  "vp-vnp/Challenge.lean",
  "vp-vnp/comparator.json",
  "vp-vnp/lean-toolchain",
  "vp-vnp/lakefile.toml",
  "vp-vnp/lake-manifest.json",
  "vp-vnp/scripts",
  "hillclimb.toml",
  ".github",
]
local_build = ["lake exe cache get", "lake build"]
theorems = [
  "Solution.mainTheorem",
  "Solution.mainTheoremApprox",
  "Solution.separation",
  "Solution.separationClosure",
  "Solution.permanent_over_real",
]

[score]
primary = "tokens"
min_delta = 25
max_line_length = 100
max_build_ratio = 1.3
guards = [
  { metric = "loc", max_increase_pct = 0.5 },
  { metric = "decls", max_increase_pct = 0.5 },
  { metric = "bytes", max_increase_pct = 0.5 },
]

[review]
required = 1
large_change_files = 20
required_large = 2
min_account_age_days = 30

[ideas]
label = "idea"
lease_hours = 3

[build]
workflow = "hillclimb-verify.yml"

[[deny]]
name = "sorry"
pattern = '\b(sorry|admit)\b'
mode = "forbid"
description = "`sorry` or `admit` (unfinished proofs)."

[[deny]]
name = "axiom"
pattern = '(?m)^\s*(?:@\[[^\]]*\]\s*)*(?:(?:private|protected|public)\s+)*axiom\b'
mode = "forbid"
description = "New axioms."

[[deny]]
name = "native evaluation"
pattern = '\b(native_decide|ofReduceBool|reduceBool|trustCompiler)\b'
mode = "forbid"
description = "`native_decide` and other ways of trusting compiled code instead of the proof kernel."

[[deny]]
name = "escape hatches"
pattern = '\b(unsafe|implemented_by|extern|opaque|unsafeCast|lcProof)\b'
mode = "forbid"
description = "`unsafe`, `implemented_by`, `extern`, `opaque` and similar escape hatches."

[[deny]]
name = "compile-time code"
pattern = '(#eval|#exit|\brun_cmd\b|\brun_elab\b|\brun_meta\b|\binitialize\b|\bbuiltin_initialize\b|\belab\b|\belab_rules\b|\bcommand_elab\b|\bterm_elab\b|\btactic\s*:\s*Tactic\b)'
mode = "forbid"
description = "Code that runs during compilation (`#eval`, `run_cmd`, `elab`, `initialize`)."

[[deny]]
name = "macros and notation"
pattern = '\b(macro|macro_rules|syntax|declare_syntax_cat|notation|notation3|infix|infixl|infixr|prefix|postfix|binder_predicate)\b'
mode = "no_increase"
description = "More macros, syntax or notation than there are today (no private shorthand languages)."

[[deny]]
name = "maxHeartbeats"
pattern = '\bmaxHeartbeats\s+(\d+)'
mode = "no_increase"
max_value = 4000000
description = "More `maxHeartbeats` overrides than there are today, or any above 4,000,000."

[[deny]]
name = "resource limits"
pattern = '\b(maxRecDepth|synthInstance\.maxSize|synthInstance\.maxHeartbeats|exponentiation\.threshold)\b'
mode = "no_increase"
description = "More raised resource limits (`maxRecDepth`, `synthInstance.maxSize`, `exponentiation.threshold`) than there are today."
