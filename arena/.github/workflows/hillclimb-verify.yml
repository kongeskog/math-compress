name: hillclimb-verify
run-name: "verify #${{ github.event.pull_request.number || inputs.pr }}"

# Runs from main for every pull request. Do not change the trigger to
# `pull_request`: the definition must never come from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (0 builds main and refreshes the build cache)
        required: true
        type: number
      stack:
        description: Pull requests to apply first, in order (space separated; set by the gatekeeper)
        required: false
        type: string
        default: ""

permissions:
  contents: read

# A new push to a pull request supersedes its running verification. Runs the
# gatekeeper dispatches (re-verification, builds of main) never cancel one in
# progress; they wait behind it.
concurrency:
  group: hillclimb-verify-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  verify:
    uses: kongeskog/math-compress/.github/workflows/verify.yml@main
    with:
      pr: ${{ fromJSON(format('{0}', github.event.pull_request.number || inputs.pr)) }}
      stack: ${{ inputs.stack || '' }}
      dir: vp-vnp

  # Wake the gatekeeper when verification ends. It is dispatched rather than
  # chained with `workflow_run`, because GitHub stops such chains after three
  # levels. This job touches no pull request content.
  notify:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hillclimb-gate.yml -R "$GITHUB_REPOSITORY" --ref main
