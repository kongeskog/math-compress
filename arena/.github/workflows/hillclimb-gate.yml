name: hillclimb-gate

on:
  # Safe on pull_request_target: the gatekeeper never checks out or runs pull
  # request content, it only reads metadata through the API.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, closed]
    branches: [main]
  issues:
    types: [opened, edited, labeled, closed, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write

jobs:
  gate:
    uses: kongeskog/math-compress/.github/workflows/gatekeeper.yml@main
